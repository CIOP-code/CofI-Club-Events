# wrangler.toml
name = 'cofi-club-events'
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"


[[d1_databases]]
binding = "DB"
database_name = "club-events-db-new"
database_id = "ecf69327-715b-4fc9-97c6-36dc75a631e0"

[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "club-events-db-preview"
database_id = "2fe7809f-fa14-4be0-980d-d7f3757e514d"

# Store sensitive values as Wrangler secrets (never in plaintext here):
#   wrangler pages secret put JWT_SECRET
#   wrangler pages secret put ADMIN_PASSWORD
#
# Both are REQUIRED — there is no built-in fallback (removed deliberately: a hardcoded fallback
# baked into this public repo would mean a deployment that forgot to set these would silently
# accept forged admin tokens / the well-known default admin password instead of failing loudly).
#
# IMPORTANT: Production and Preview are separate environments with separate secrets in Cloudflare
# Pages — setting these for Production does NOT set them for Preview deployments (PRs/branches),
# same as the separate club-events-db-preview D1 database above. Set both in the Cloudflare
# dashboard under Pages project -> Settings -> Environment variables, which has distinct
# Production and Preview tabs — add JWT_SECRET and ADMIN_PASSWORD (any values; they don't need to
# match production's) under Preview too, or every preview deployment's login will fail with
# "Server misconfigured: JWT_SECRET is not set" the moment someone tries to log in there.
#
# For local dev (wrangler pages dev), create a .dev.vars file (git-ignored) with:
#   JWT_SECRET=dev-secret-change-in-production
#   ADMIN_PASSWORD=CollegeOfIdaho2024!
